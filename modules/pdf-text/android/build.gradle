plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pdftext'
version = '0.1.0'

android {
  namespace "expo.modules.pdftext"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Android 向けの PDFBox: ページの文字を読む。iOS では PDFKit がこれを担う。
  implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
